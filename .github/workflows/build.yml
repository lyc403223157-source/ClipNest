name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  web-tests:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: cross-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cross-platform/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check

  macos:
    needs: web-tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: bash ./build.sh
      - run: ditto -c -k --sequesterRsrc --keepParent dist/ClipNest.app ClipNest-${GITHUB_REF_NAME#v}-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ClipNest-macOS
          path: ClipNest-*-macos-arm64.zip

  windows:
    needs: web-tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: cross-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cross-platform/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run prepare-icons
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: ClipNest-Windows
          path: cross-platform/src-tauri/target/release/bundle/nsis/*.exe

  linux:
    needs: web-tests
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: cross-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cross-platform/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri and keyboard hook dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libx11-dev \
            libxtst-dev \
            patchelf
      - run: npm ci
      - run: npm run prepare-icons
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build -- --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: ClipNest-Linux
          path: |
            cross-platform/src-tauri/target/release/bundle/deb/*.deb
            cross-platform/src-tauri/target/release/bundle/appimage/*.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: ClipNest ${{ github.ref_name }}
          body: |
            ClipNest cross-platform MVP.

            - macOS: native AppKit application; quick panel uses Control+V and keeps Command+V as direct paste.
            - Windows/Linux: Tauri application; quick panel uses Alt+V and keeps Ctrl+V as direct paste.
            - Clipboard data remains local on the device.

            The macOS preview is ad-hoc signed and not notarized. Linux global shortcuts currently target X11; Wayland support depends on the desktop portal and compositor.
          files: release/*
